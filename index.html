<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色彩採集 Color Hunting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17171b;
    --paper:#f2ede2;
    --card:#1f2024;
    --card-mat:#faf7ef;
    --muted:#9a978d;
    --muted-dark:#5c5b56;
    --brass:#c9a961;
    --brass-dim:#9c8248;
    --line:#3a3a40;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:48px 24px 96px;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,169,97,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,169,97,0.05), transparent 45%);
  }
  .wrap{max-width:1100px;margin:0 auto;}

  header{margin-bottom:44px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:14px;
  }
  h1{
    font-family:'Newsreader',serif;
    font-weight:500;
    font-size:clamp(34px,5vw,54px);
    line-height:1.05;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  h1 em{font-style:italic;font-weight:400;color:var(--brass);}
  .sub{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    max-width:560px;
  }

  /* mode switch */
  .mode-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .mode-switch{
    display:inline-flex;
    border:1px solid var(--line);
    background:var(--card);
  }
  .mode-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.06em;
    padding:11px 18px;
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  .mode-btn + .mode-btn{border-left:1px solid var(--line);}
  .mode-btn.active{background:var(--brass); color:var(--ink); font-weight:600;}
  .mode-btn:not(.active):hover{color:var(--paper);}
  .mode-hint{
    font-size:12px;
    color:var(--muted-dark);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    max-width:420px;
  }

  /* mixing tray - signature element */
  .tray{
    display:flex;
    gap:0;
    border:1px solid var(--line);
    margin-bottom:28px;
    background:var(--card);
    position:relative;
    overflow:hidden;
  }
  .tray-swatch{
    width:180px;
    min-width:140px;
    position:relative;
    transition:background-color .12s linear;
    border-right:1px solid var(--line);
  }
  .tray-swatch::after{
    content:'';
    position:absolute;
    inset:10px;
    border:1px solid rgba(255,255,255,0.25);
    pointer-events:none;
  }
  .tray-info{
    flex:1;
    padding:22px 26px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;
  }
  .tray-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted-dark);
  }
  .tray-hex{
    font-family:'JetBrains Mono',monospace;
    font-size:26px;
    font-weight:500;
    letter-spacing:0.02em;
    color:var(--paper);
  }
  .tray-hex.busy{color:var(--brass);}
  .tray-rgb{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--muted);
  }
  .tray-count{
    font-size:12.5px;
    color:var(--muted-dark);
  }
  .tray-progress{
    position:absolute;
    left:0; bottom:0;
    height:2px;
    background:var(--brass);
    width:0%;
    transition:width .15s linear;
  }

  .drop{
    border:1px dashed var(--line);
    padding:36px 24px;
    text-align:center;
    cursor:pointer;
    margin-bottom:22px;
    transition:border-color .2s ease, background-color .2s ease;
    position:relative;
  }
  .drop:hover, .drop.drag{
    border-color:var(--brass-dim);
    background:rgba(201,169,97,0.04);
  }
  .drop-title{
    font-family:'Newsreader',serif;
    font-size:19px;
    margin-bottom:6px;
  }
  .drop-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted-dark);
    letter-spacing:0.05em;
  }
  input[type=file]{display:none;}

  .analyze-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:56px;
    flex-wrap:wrap;
  }
  .analyze-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink);
    background:var(--brass);
    border:none;
    padding:14px 26px;
    cursor:pointer;
    transition:background-color .18s ease, transform .12s ease;
  }
  .analyze-btn:hover:not(:disabled){background:#dab976;}
  .analyze-btn:active:not(:disabled){transform:scale(0.97);}
  .analyze-btn:disabled{
    background:var(--card);
    color:var(--muted-dark);
    border:1px solid var(--line);
    cursor:not-allowed;
  }
  .analyze-note{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted-dark);
    letter-spacing:0.03em;
  }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
    margin-bottom:26px;
  }
  .section-title{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .clear-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.05em;
    color:var(--muted-dark);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .clear-btn:hover{color:var(--brass);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(190px,1fr));
    gap:22px;
  }
  .card{
    background:var(--card-mat);
    padding:10px 10px 0;
    position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    animation:pin .35s ease both;
  }
  @keyframes pin{
    from{opacity:0; transform:translateY(8px) rotate(0deg);}
    to{opacity:1; transform:translateY(0) rotate(var(--tilt,0deg));}
  }
  .card{transform:rotate(var(--tilt,0deg));}
  .card:hover{transform:rotate(0deg);}
  .card-photo-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
  }
  .card-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:sepia(0.03) grayscale(0);
    transition:filter .3s ease;
  }
  .card.pending .card-photo{
    filter:grayscale(0.85) brightness(0.8) sepia(0.03);
  }
  .scan-line{
    position:absolute;
    left:0; right:0; top:0;
    height:34%;
    background:linear-gradient(to bottom, rgba(201,169,97,0) 0%, rgba(201,169,97,0.55) 50%, rgba(201,169,97,0) 100%);
    transform:translateY(-100%);
    pointer-events:none;
    opacity:0;
  }
  .card.scanning .scan-line{
    animation:sweep 0.65s ease-in-out;
  }
  @keyframes sweep{
    0%{ transform:translateY(-100%); opacity:1; }
    100%{ transform:translateY(400%); opacity:1; }
  }
  .pending-tag{
    position:absolute;
    left:8px; bottom:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.75);
    background:rgba(0,0,0,0.45);
    padding:3px 7px;
    text-transform:uppercase;
  }
  .card-tag{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 2px 12px;
  }
  .card-swatch{
    width:22px;
    height:22px;
    border:1px solid rgba(0,0,0,0.15);
    flex-shrink:0;
    transition:background-color .1s linear;
  }
  .card-text{flex:1; min-width:0;}
  .card-hex{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink);
    font-weight:600;
  }
  .card-share{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--brass-dim);
    margin-top:1px;
  }
  .card-name{
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    color:#8a8477;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:1px;
  }
  .card-remove{
    position:absolute;
    top:-8px;
    right:-8px;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity .15s ease;
  }
  .card:hover .card-remove{opacity:1;}

  .empty-note{
    color:var(--muted-dark);
    font-size:13px;
    font-family:'JetBrains Mono',monospace;
    padding:20px 0;
  }

  footer{
    margin-top:80px;
    padding-top:20px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--muted-dark);
    letter-spacing:0.05em;
  }

  @media (max-width:520px){
    .tray{flex-direction:column;}
    .tray-swatch{width:100%; height:90px; border-right:none; border-bottom:1px solid var(--line);}
    .analyze-row{flex-direction:column; align-items:flex-start;}
  }

  @media (prefers-reduced-motion: reduce){
    .card{animation:none;}
    .scan-line{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Field Notebook · No. 01</div>
    <h1>色彩採集<br><em>Color Hunting</em></h1>
    <p class="sub">上傳多張照片，選擇量測方式後按下「開始分析」，逐一測出每張照片的代表色，最後調和成一份綜合色。</p>
  </header>

  <div class="mode-row">
    <div class="mode-switch">
      <button class="mode-btn active" id="modeAvgBtn" data-mode="average">平均色 Average</button>
      <button class="mode-btn" id="modeDomBtn" data-mode="dominant">主色聚類 Clustering</button>
    </div>
    <div class="mode-hint" id="modeHint">將照片所有像素直接取平均值，容易被大面積的天空或牆面拉走顏色。</div>
  </div>

  <div class="tray">
    <div class="tray-swatch" id="traySwatch" style="background:#2a2a2e;"></div>
    <div class="tray-info">
      <div class="tray-label" id="trayLabel">調和色 / Mixed Average</div>
      <div class="tray-hex" id="trayHex">— — —</div>
      <div class="tray-rgb" id="trayRgb">rgb( — , — , — )</div>
      <div class="tray-count" id="trayCount">尚未採集任何標本</div>
    </div>
    <div class="tray-progress" id="trayProgress"></div>
  </div>

  <label class="drop" id="dropZone" for="fileInput">
    <div class="drop-title">拖曳照片到這裡，或點擊選取</div>
    <div class="drop-sub">支援多張選取 · JPG / PNG / WEBP</div>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </label>

  <div class="analyze-row">
    <button class="analyze-btn" id="analyzeBtn" disabled>開始分析</button>
    <div class="analyze-note" id="analyzeNote">請先上傳照片</div>
  </div>

  <div class="section-head">
    <div class="section-title" id="specimenCount">標本 Specimens (0)</div>
    <button class="clear-btn" id="clearBtn">清空全部</button>
  </div>

  <div class="grid" id="grid">
    <div class="empty-note" id="emptyNote">— 空的抽屜，等待第一份標本 —</div>
  </div>

  <footer>每張照片皆在瀏覽器本機端計算，不會上傳到任何伺服器。主色聚類使用簡化版 k-means（k=5）。</footer>
</div>

<canvas id="workCanvas" width="44" height="44" style="display:none;"></canvas>

<script>
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const grid = document.getElementById('grid');
const specimenCount = document.getElementById('specimenCount');
const clearBtn = document.getElementById('clearBtn');
const traySwatch = document.getElementById('traySwatch');
const trayLabel = document.getElementById('trayLabel');
const trayHex = document.getElementById('trayHex');
const trayRgb = document.getElementById('trayRgb');
const trayCount = document.getElementById('trayCount');
const trayProgress = document.getElementById('trayProgress');
const analyzeBtn = document.getElementById('analyzeBtn');
const analyzeNote = document.getElementById('analyzeNote');
const modeAvgBtn = document.getElementById('modeAvgBtn');
const modeDomBtn = document.getElementById('modeDomBtn');
const modeHint = document.getElementById('modeHint');
const canvas = document.getElementById('workCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const SAMPLE_SIZE = 44; // downsample resolution per photo (44x44 = 1936 px)
const K = 5;             // number of clusters for dominant-color mode
const ITER = 6;           // k-means iterations

let mode = 'average'; // 'average' | 'dominant'
let specimens = []; // {id, name, url, pixels:[[r,g,b],...], avg:{r,g,b,hex}, dom:{r,g,b,hex,share}, analyzed, tilt}
let idSeq = 0;
let isAnimating = false;

function toHex(n){ return Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,'0'); }
function rgbToHex(r,g,b){ return '#' + toHex(r) + toHex(g) + toHex(b); }
function randHexChar(){ return '0123456789abcdef'[Math.floor(Math.random()*16)]; }
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

function extractPixels(img){
  const size = SAMPLE_SIZE;
  canvas.width = size; canvas.height = size;
  ctx.clearRect(0,0,size,size);
  ctx.drawImage(img, 0, 0, size, size);
  const data = ctx.getImageData(0,0,size,size).data;
  const pixels = [];
  for(let i=0; i<data.length; i+=4){
    if(data[i+3] < 10) continue; // skip transparent
    pixels.push([data[i], data[i+1], data[i+2]]);
  }
  return pixels.length ? pixels : [[0,0,0]];
}

function averageOf(pixels){
  let r=0,g=0,b=0;
  for(const p of pixels){ r+=p[0]; g+=p[1]; b+=p[2]; }
  const n = pixels.length;
  const rr = r/n, gg = g/n, bb = b/n;
  return { r: Math.round(rr), g: Math.round(gg), b: Math.round(bb), hex: rgbToHex(rr,gg,bb) };
}

// simplified k-means: returns the centroid of the largest cluster + its share
function dominantOf(pixels, k=K, iterations=ITER){
  if(pixels.length <= k){
    const avg = averageOf(pixels);
    return { r: avg.r, g: avg.g, b: avg.b, hex: avg.hex, share: 1 };
  }
  // k-means++ style init: first centroid random, rest chosen far from existing ones
  let centroids = [pixels[Math.floor(Math.random()*pixels.length)].slice()];
  while(centroids.length < k){
    let bestPixel = null, bestDist = -1;
    const tries = Math.min(pixels.length, 300);
    for(let t=0; t<tries; t++){
      const p = pixels[Math.floor(Math.random()*pixels.length)];
      let minD = Infinity;
      for(const c of centroids){
        const dr=p[0]-c[0], dg=p[1]-c[1], db=p[2]-c[2];
        const d = dr*dr+dg*dg+db*db;
        if(d < minD) minD = d;
      }
      if(minD > bestDist){ bestDist = minD; bestPixel = p; }
    }
    centroids.push(bestPixel.slice());
  }

  let assignments = new Array(pixels.length).fill(0);
  for(let it=0; it<iterations; it++){
    for(let i=0;i<pixels.length;i++){
      let best=0, bestDist=Infinity;
      const p = pixels[i];
      for(let c=0;c<centroids.length;c++){
        const cc = centroids[c];
        const dr=p[0]-cc[0], dg=p[1]-cc[1], db=p[2]-cc[2];
        const d = dr*dr+dg*dg+db*db;
        if(d < bestDist){ bestDist=d; best=c; }
      }
      assignments[i] = best;
    }
    const sums = centroids.map(()=>[0,0,0,0]);
    for(let i=0;i<pixels.length;i++){
      const c = assignments[i];
      sums[c][0]+=pixels[i][0]; sums[c][1]+=pixels[i][1]; sums[c][2]+=pixels[i][2]; sums[c][3]++;
    }
    for(let c=0;c<centroids.length;c++){
      if(sums[c][3] > 0){
        centroids[c] = [sums[c][0]/sums[c][3], sums[c][1]/sums[c][3], sums[c][2]/sums[c][3]];
      }
    }
  }

  const counts = new Array(centroids.length).fill(0);
  for(const a of assignments) counts[a]++;
  let bestC = 0;
  for(let c=1;c<centroids.length;c++) if(counts[c] > counts[bestC]) bestC = c;
  const col = centroids[bestC];
  return {
    r: Math.round(col[0]), g: Math.round(col[1]), b: Math.round(col[2]),
    hex: rgbToHex(col[0], col[1], col[2]),
    share: counts[bestC] / pixels.length
  };
}

function currentColorOf(s){
  return mode === 'average' ? s.avg : s.dom;
}

function handleFiles(fileList){
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const pixels = extractPixels(img);
        const avg = averageOf(pixels);
        const specimen = {
          id: idSeq++,
          name: file.name,
          url: e.target.result,
          pixels,
          avg,
          dom: null,
          analyzed: false,
          tilt: (Math.random()*4 - 2).toFixed(2)
        };
        specimens.push(specimen);
        render();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function removeSpecimen(id){
  specimens = specimens.filter(s => s.id !== id);
  render();
}

function setMode(newMode){
  if(mode === newMode || isAnimating) return;
  mode = newMode;
  modeAvgBtn.classList.toggle('active', mode === 'average');
  modeDomBtn.classList.toggle('active', mode === 'dominant');
  modeHint.textContent = mode === 'average'
    ? '將照片所有像素直接取平均值，容易被大面積的天空或牆面拉走顏色。'
    : '把像素分成 5 群（k-means 聚類），取數量最多的那一群當作代表色，較接近人眼認定的「主色」。';
  trayLabel.textContent = mode === 'average' ? '調和色 / Mixed Average' : '主色 / Dominant Cluster';
  // switching mode requires re-running the animation so results reflect the new method
  specimens.forEach(s => { s.analyzed = false; });
  render();
}

function render(){
  grid.innerHTML = '';
  if(specimens.length === 0){
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = '— 空的抽屜，等待第一份標本 —';
    grid.appendChild(note);
  } else {
    specimens.forEach(s => {
      const col = currentColorOf(s);
      const card = document.createElement('div');
      card.className = 'card' + (s.analyzed ? '' : ' pending');
      card.dataset.id = s.id;
      card.style.setProperty('--tilt', s.tilt + 'deg');
      const shareLine = (mode === 'dominant' && s.analyzed && s.dom)
        ? `<div class="card-share">占比 ${Math.round(s.dom.share*100)}%</div>` : '';
      card.innerHTML = `
        <div class="card-photo-wrap">
          <img class="card-photo" src="${s.url}" alt="${s.name}">
          <div class="scan-line"></div>
          ${s.analyzed ? '' : '<div class="pending-tag">待分析</div>'}
        </div>
        <div class="card-tag">
          <div class="card-swatch" style="background:${s.analyzed ? col.hex : '#d8d3c6'};"></div>
          <div class="card-text">
            <div class="card-hex">${s.analyzed ? col.hex.toUpperCase() : '------'}</div>
            ${shareLine}
            <div class="card-name" title="${s.name}">${s.name}</div>
          </div>
        </div>
        <button class="card-remove" title="移除">×</button>
      `;
      card.querySelector('.card-remove').addEventListener('click', () => removeSpecimen(s.id));
      grid.appendChild(card);
    });
  }

  specimenCount.textContent = `標本 Specimens (${specimens.length})`;

  const pendingCount = specimens.filter(s => !s.analyzed).length;
  const analyzedCount = specimens.length - pendingCount;

  if(!isAnimating){
    if(specimens.length === 0){
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = '開始分析';
      analyzeNote.textContent = '請先上傳照片';
    } else if(pendingCount === 0){
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = '重新分析';
      analyzeNote.textContent = `${analyzedCount} 份標本已完成分析`;
    } else {
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = analyzedCount > 0 ? `分析新標本 (${pendingCount})` : '開始分析';
      analyzeNote.textContent = `${pendingCount} 份標本等待分析`;
    }
    updateTrayStatic();
  }
}

function updateTrayStatic(){
  const analyzed = specimens.filter(s => s.analyzed);
  if(analyzed.length === 0){
    traySwatch.style.background = '#2a2a2e';
    trayHex.textContent = '— — —';
    trayHex.classList.remove('busy');
    trayRgb.textContent = 'rgb( — , — , — )';
    trayCount.textContent = specimens.length ? '尚未分析，按下開始分析' : '尚未採集任何標本';
    trayProgress.style.width = '0%';
    return;
  }
  const pooled = [];
  analyzed.forEach(s => pooled.push(...s.pixels));
  const result = mode === 'average' ? averageOf(pooled) : dominantOf(pooled);
  traySwatch.style.background = result.hex;
  trayHex.textContent = result.hex.toUpperCase();
  trayHex.classList.remove('busy');
  trayRgb.textContent = `rgb( ${result.r}, ${result.g}, ${result.b} )`;
  trayCount.textContent = mode === 'average'
    ? `由 ${analyzed.length} 份標本調和而成`
    : `由 ${analyzed.length} 份標本共同聚類，最大色群占 ${Math.round((result.share||0)*100)}%`;
  trayProgress.style.width = '0%';
}

async function scrambleHex(el, finalHex, duration){
  const steps = 8;
  const stepTime = duration / steps;
  for(let i=0;i<steps;i++){
    let s = '#';
    for(let j=0;j<6;j++) s += randHexChar();
    el.textContent = s.toUpperCase();
    await sleep(stepTime);
  }
  el.textContent = finalHex.toUpperCase();
}

async function animate(){
  if(isAnimating) return;
  const pending = specimens.filter(s => !s.analyzed);
  const targets = pending.length > 0 ? pending : specimens;
  if(targets.length === 0) return;

  isAnimating = true;
  analyzeBtn.disabled = true;
  analyzeBtn.textContent = '分析中…';
  analyzeNote.textContent = mode === 'average' ? '正在逐一量測像素平均值' : '正在逐一進行像素聚類分析';
  trayHex.classList.add('busy');
  modeAvgBtn.disabled = true;
  modeDomBtn.disabled = true;

  if(pending.length === 0){
    specimens.forEach(s => s.analyzed = false);
    render();
  }

  for(let i=0; i<targets.length; i++){
    const s = targets[i];
    if(mode === 'dominant' && !s.dom){
      s.dom = dominantOf(s.pixels);
    }
    const col = currentColorOf(s);
    const card = grid.querySelector(`.card[data-id="${s.id}"]`);
    if(card){
      card.classList.add('scanning');
      await sleep(300);
      const swatch = card.querySelector('.card-swatch');
      const hexEl = card.querySelector('.card-hex');
      swatch.style.background = col.hex;
      await scrambleHex(hexEl, col.hex, 260);
      await sleep(120);
      card.classList.remove('pending','scanning');
      const pendingTag = card.querySelector('.pending-tag');
      if(pendingTag) pendingTag.remove();
      if(mode === 'dominant' && s.dom){
        const cardTextEl = card.querySelector('.card-text');
        if(cardTextEl && !cardTextEl.querySelector('.card-share')){
          const shareEl = document.createElement('div');
          shareEl.className = 'card-share';
          shareEl.textContent = `占比 ${Math.round(s.dom.share*100)}%`;
          cardTextEl.insertBefore(shareEl, cardTextEl.querySelector('.card-name'));
        }
      }
    }
    s.analyzed = true;

    const analyzedSoFar = specimens.filter(x => x.analyzed);
    const pooled = [];
    analyzedSoFar.forEach(x => pooled.push(...x.pixels));
    const liveResult = mode === 'average' ? averageOf(pooled) : dominantOf(pooled, K, 4);
    traySwatch.style.background = liveResult.hex;
    trayRgb.textContent = `rgb( ${liveResult.r}, ${liveResult.g}, ${liveResult.b} )`;
    trayProgress.style.width = `${Math.round((i+1)/targets.length*100)}%`;
  }

  const analyzed = specimens.filter(s => s.analyzed);
  const pooledFinal = [];
  analyzed.forEach(x => pooledFinal.push(...x.pixels));
  const finalResult = mode === 'average' ? averageOf(pooledFinal) : dominantOf(pooledFinal);
  await scrambleHex(trayHex, finalResult.hex, 420);
  traySwatch.style.background = finalResult.hex;
  trayRgb.textContent = `rgb( ${finalResult.r}, ${finalResult.g}, ${finalResult.b} )`;
  trayCount.textContent = mode === 'average'
    ? `由 ${analyzed.length} 份標本調和而成`
    : `由 ${analyzed.length} 份標本共同聚類，最大色群占 ${Math.round((finalResult.share||0)*100)}%`;

  isAnimating = false;
  modeAvgBtn.disabled = false;
  modeDomBtn.disabled = false;
  trayHex.classList.remove('busy');
  render();
}

fileInput.addEventListener('change', (e) => {
  handleFiles(e.target.files);
  fileInput.value = '';
});

['dragenter','dragover'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => {
    e.preventDefault(); e.stopPropagation();
    dropZone.classList.add('drag');
  });
});
['dragleave','drop'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => {
    e.preventDefault(); e.stopPropagation();
    dropZone.classList.remove('drag');
  });
});
dropZone.addEventListener('drop', (e) => {
  const dt = e.dataTransfer;
  if(dt && dt.files) handleFiles(dt.files);
});

clearBtn.addEventListener('click', () => {
  if(isAnimating) return;
  specimens = [];
  render();
});

analyzeBtn.addEventListener('click', () => {
  animate();
});

modeAvgBtn.addEventListener('click', () => setMode('average'));
modeDomBtn.addEventListener('click', () => setMode('dominant'));

render();
</script>
</body>
</html>
